[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semanticlint"
version = "0.6.0"
description = "Extensible linter and quality pipeline for RDF, SKOS, OWL and RDFS vocabularies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.0",
    "coverage[toml]>=7.0",
    "diff-cover>=9.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "mutmut>=3.8",
]
# craft-gate's craftCov scan (scripts/craftcov.py) and the Refactor First CI
# gate built on it (scripts/check_refactor_first.py) — see CRAFTSMANSHIP.md.
# pyyaml is already an unconditional dependency above; ruff/pylint/vulture
# are what `uv sync --extra craftcov` alone needs to run either script.
craftcov = [
    "ruff>=0.13",
    "pylint>=3.3",
    "vulture>=2.14",
]
# craft-gate's complexity ratchet (scripts/check_complexity_ratchet.py) —
# see CRAFTSMANSHIP.md's "The complexity ratchet".
complexity = [
    "radon>=6.0",
    "cognitive-complexity>=1.3",
]
mutation = [
    "mutmut>=3.8",
]

[tool.mutmut]
source_paths = ["src/semanticlint"]
cache_invalidation_files = ["tests/**/*.py", "conftest.py"]
on_dependency_change = "rerun"

[project.scripts]
semanticlint = "semanticlint.cli:main"

[project.urls]
Homepage   = "https://github.com/gbelbe/semanticlint"
Repository = "https://github.com/gbelbe/semanticlint"
Issues     = "https://github.com/gbelbe/semanticlint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/semanticlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short"

[tool.coverage.run]
source = ["semanticlint"]
omit   = ["src/semanticlint/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM",
]
ignore = [
    "E501",
    "E701",
    "E702",
    "E741",
    "E402",
    "B008",
    "B904",
    "SIM105",
    "SIM108",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version         = "3.11"
ignore_missing_imports = true
warn_return_any        = false
warn_unused_ignores    = false
pretty                 = true
